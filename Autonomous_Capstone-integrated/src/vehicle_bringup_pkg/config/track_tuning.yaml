track_controller_node:
  ros__parameters:
    # Primary driving controls
    # Preserve the previous effective launch default; explicit/saved/GUI values win.
    speed: 250
    stanley_gain: 0.020
    heading_gain: 0.60
    lookahead_index: 10
    car_center_x: 325.0
    # Perception and lane extraction
    confidence: 0.50
    bev_top_shift: -8
    # Camera-space BEV source points (TL/TR/BR/BL). Top Y adds bev_top_shift.
    bev_src_tl_x: 238
    bev_src_tl_y: 316
    bev_src_tr_x: 402
    bev_src_tr_y: 313
    bev_src_br_x: 501
    bev_src_br_y: 476
    bev_src_bl_x: 155
    bev_src_bl_y: 476
    roi_cut: 300
    look_shift: 50
    ema_alpha: 0.60
    virtual_lane_width: 300
    # Filled-mask centerline stabilization. These are advanced parameters and
    # are intentionally not exposed as GUI sliders.
    center_ema_alpha: 0.35
    max_center_jump_px: 80.0
    max_missed_frames: 12
    min_component_area: 250

    # Steering angle used by the Stanley angle-to-command mapping
    max_steering_angle: 50.0
