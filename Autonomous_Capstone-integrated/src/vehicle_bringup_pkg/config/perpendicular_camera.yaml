# EXAMPLE ONLY: these values are NOT measurements of the user's vehicle.
# Keep calibration_confirmed false until the commissioning steps in README pass.
# This schema is separate from the numeric legacy parking tuner YAML.
control:
  calibration_confirmed: false
  observation_timeout_s: 0.5
  observation_loss_fault_s: 5.0
  space_missing_frames: 5
  forward_pwm: 70
  reverse_pwm: 60
  exit_pwm: 70
  max_steering: 7
  steering_sign: 1
  front_target_x: 0.7
  rear_target_x: 0.5
  front_position_gain: 135.0
  front_angle_gain: 8.771929824561404
  rear_position_gain: 14.0
  rear_angle_gain: 16.0
  end_angle_gain: 50.0
  exit_position_gain: 0.5
  exit_angle_gain: 10.0
  steering_deadband: 0.3
  align_steering: -7
  align_fallback_s: 5.0
  front_limit_stop_y: 0.80  # front BEV row; tune with the parking bay and bumper in preview
  direction_pause_s: 0.7
  reverse_right_s: 3.0
  end_steering_y: 0.78125  # reference 1000 pixels / 1280
  end_stop_y: 0.9765625  # reference 1250 pixels / 1280; tune on the vehicle
  stopped_hold_s: 3.0
  exit_enabled: true
  escape_s: 1.5
  outline_finish_y: 0.90
  final_straight_s: 2.5
  search_timeout_s: 60.0
  maneuver_timeout_s: 25.0

front:
  device: /dev/video0
  image_topic: /parking_camera/front/image_raw
  model_path: package://skku_track_drive_pkg/models/parking/parking_front.pt
  model_device: cuda:0
  confidence: 0.5
  width: 1280
  height: 720  # matches the front training images' 16:9 aspect ratio
  fps: 15.0
  rotate_deg: 0  # clockwise, then optional horizontal flip, BEFORE inference
  flip_horizontal: false
  classes:
    parking_lot: parking_lot
    parking_space: parking_space
    out_line: out_line
  persp_src: [0.24, 1.0, 0.76, 1.0, 0.62, 0.6, 0.38, 0.6]
  persp_dst: [0.40, 1.0, 0.60, 1.0, 0.60, 0.6, 0.40, 0.6]
  min_area_ratio: 0.001
  morph_kernel: 3
  parking_width_ratio: 0.40
  pair_min_separation_ratio: 0.15
  pair_max_angle_rad: 0.65
  min_longitudinal_span_ratio: 0.05
  limit_x_min: 0.32
  limit_x_max: 0.68
  limit_y_min: 0.45
  limit_y_max: 0.92
  limit_white_min: 165
  limit_min_span: 0.12

rear:
  device: /dev/video2
  image_topic: /parking_camera/rear/image_raw
  model_path: package://skku_track_drive_pkg/models/parking/parking_rear.pt
  model_device: cuda:0
  confidence: 0.5
  width: 1280
  height: 720
  fps: 15.0
  rotate_deg: 0  # normal landscape mounting; keep the scene upright before inference
  flip_horizontal: false
  classes:
    parking_space: parking_space
    end_line: end_line
  persp_src: [0.0, 1.0, 1.0, 1.0, 0.65, 0.25, 0.35, 0.25]
  persp_dst: [0.25, 1.0, 0.75, 1.0, 0.75, 0.15, 0.25, 0.15]
  min_area_ratio: 0.001
  morph_kernel: 3
  parking_width_ratio: 0.40  # calibrate BEV slot width / BEV image width
  roi_band_ratio: 0.02  # boundary band kernel / short image dimension
  pair_min_separation_ratio: 0.2777777777777778  # reference 200 pixels / 720
  pair_max_angle_rad: 0.6981317007977318  # reference 40 degrees
  min_longitudinal_span_ratio: 0.0234375

save_path: ~/.config/autodrive/perpendicular_camera.yaml
