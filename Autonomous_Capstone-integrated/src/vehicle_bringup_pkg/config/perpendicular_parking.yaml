# Mode-specific settings. Zero parking dimensions/speeds mean UNMEASURED.
perpendicular_parking_controller_node:
  ros__parameters:
    geometry_confirmed: 0
    lidar_x_m: 0.0
    lidar_y_m: 0.0
    lidar_yaw_deg: 0.0
    scan_angle_sign: 1
    visible_min_deg: -135.0
    visible_max_deg: 135.0
    range_min_m: 0.15
    range_max_m: 5.0
    scan_timeout_s: 0.5
    forward_pwm: 85
    reverse_pwm: 60
    steer_step: 7
    steering_sign: 1
    side: -1
    side_center_deg: 90.0
    side_half_width_deg: 10.0
    side_detect_m: 1.5
    confirm_scans: 3
    pause_s: 5.0
    settle_s: 0.5
    search_timeout_s: 60.0
    maneuver_timeout_s: 60.0
    collision_margin_m: 0.15
    wheelbase_m: 0.0
    front_overhang_m: 0.0
    rear_overhang_m: 0.0
    vehicle_width_m: 0.0
    forward_mps: 0.0
    reverse_mps: 0.0
    max_wheel_angle_deg: 0.0
    start_detect_m: 2.5
    case1_max_m: 1.0
    case2_max_m: 1.5
    case3_max_m: 2.0
    fwd_straight_out_s: 1.5
    fwd_turn_out_s: 12.0
    finish_s: 30.0
    exit_enabled: 0
    case1_fwd_turn_s: 10.0
    case1_rev_straight_s: 2.5
    case1_rev_turn_s: 2.0
    case2_fwd_turn_s: 9.0
    case2_rev_straight_s: 2.0
    case2_rev_turn_s: 3.0
    case3_fwd_turn_s: 9.0
    case3_rev_straight_s: 2.0
    case3_rev_turn_s: 3.0
    case4_fwd_turn_s: 8.0
    case4_rev_straight_s: 2.0
    case4_rev_turn_s: 2.5
